<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="avatar">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#161a35"/>
      <stop offset="55%"  stop-color="#0d1130"/>
      <stop offset="100%" stop-color="#070a18"/>
    </linearGradient>
    <!-- userSpaceOnUse：避免纯竖直/水平线因 bbox 退化而整段不渲染 -->
    <linearGradient id="lineGrad" gradientUnits="userSpaceOnUse" x1="80" y1="58" x2="170" y2="176">
      <stop offset="0%"   stop-color="#25d3ff"/>
      <stop offset="50%"  stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#3ef2b0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%"   stop-color="#25d3ff" stop-opacity=".32"/>
      <stop offset="62%"  stop-color="#7c5cff" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circle"><circle cx="120" cy="120" r="118"/></clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="240" height="240" fill="url(#bgGrad)"/>
    <rect width="240" height="240" fill="url(#glow)"/>

    <!-- 网格 -->
    <g stroke="#8ea2ff" stroke-opacity=".12" stroke-width="1">
      <path d="M0 60H240M0 120H240M0 180H240M60 0V240M120 0V240M180 0V240"/>
    </g>

    <!-- 字母 L：竖笔 + 横笔 -->
    <g fill="none" stroke="url(#lineGrad)" stroke-width="13"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M96 58 L96 168"/>
      <path d="M96 168 L160 168"/>
    </g>

    <!-- 装饰 -->
    <circle cx="96" cy="58" r="4.6" fill="#25d3ff" opacity=".95"/>
    <circle cx="160" cy="168" r="4.6" fill="#3ef2b0" opacity=".95"/>
    <ellipse cx="120" cy="120" rx="98" ry="40" fill="none"
             stroke="#7c5cff" stroke-opacity=".3" stroke-width="1.3"
             transform="rotate(-22 120 120)"/>
    <circle cx="196" cy="84" r="3.4" fill="#ff5c8a"/>
    <circle cx="48" cy="158" r="2.6" fill="#3ef2b0" opacity=".85"/>
  </g>

  <circle cx="120" cy="120" r="117" fill="none" stroke="#ffffff" stroke-opacity=".15" stroke-width="2"/>
</svg>
